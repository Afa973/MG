<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Metric Gym</title>
  <style>
    :root { color-scheme: light; font-family: Inter, Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fafafa; color: #171717; }
    main { width: min(680px, calc(100% - 32px)); padding: 48px 32px; text-align: center; background: #fff; border: 1px solid #e5e5e5; border-radius: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .eyebrow { color: #2563eb; font-size: 14px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; }
    h1 { margin: 14px 0 8px; font-size: clamp(32px, 6vw, 48px); }
    p { margin: 0 auto 30px; color: #555; font-size: 17px; }
    nav { display: grid; gap: 14px; max-width: 420px; margin: auto; }
    a { display: block; padding: 15px 20px; border-radius: 10px; background: #171717; color: #fff; font-weight: 700; text-decoration: none; }
    a:hover, a:focus-visible { background: #2563eb; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">The Business Vital Signs</div>
    <h1>Metric Gym</h1>
    <p>Choose a practice exercise.</p>
    <nav aria-label="Practice exercises">
      <a href="practice-1.html">Practice 1: Choose the Vital Sign</a>
      <a href="practice-2.html">Practice 2: Build the Bigger Picture</a>
    </nav>
  </main>
</body>
</html>
